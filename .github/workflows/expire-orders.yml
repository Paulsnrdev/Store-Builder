name: Expire unpaid bank transfer orders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  expire-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Call expiry endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/expire-orders"
