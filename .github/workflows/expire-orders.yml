name: Expire unpaid bank-transfer orders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call expire-orders endpoint
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/expire-orders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
